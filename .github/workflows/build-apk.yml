name: build-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v3

      - name: 给 gradlew 赋予执行权限
        run: chmod +x android/gradlew

      - name: 配置签名密钥
        run: |
          if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
            echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/app/key.jks
            echo "RELEASE_STORE_FILE=key.jks" > android/local.properties
            echo "RELEASE_STORE_PASSWORD=${{ secrets.KEY_STORE_PASSWORD }}" >> android/local.properties
            echo "RELEASE_KEY_ALIAS=${{ secrets.ALIAS }}" >> android/local.properties
            echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> android/local.properties
            echo "Signing key configured."
          else
            echo "No signing key. Will build debug APK."
          fi

      - name: 编译 APK
        run: |
          cd android
          if [ -f "app/key.jks" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug
          fi

      - name: 解析版本与项目名称
        run: |
          PROJECT_NAME=$(python3 -c "import re; m = re.search(r'name\s*=\s*\"([^\"]+)\"', open('pyproject.toml', encoding='utf-8').read()); print(m.group(1) if m else 'video-downloader')")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          else
            PY_VER=$(python3 -c "import re; m = re.search(r'version\s*=\s*\"([^\"]+)\"', open('pyproject.toml', encoding='utf-8').read()); print(m.group(1) if m else '1.2.0')")
            VERSION="v${PY_VER}"
          fi
          echo "PROJECT_NAME=${PROJECT_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "APK_NAME=${PROJECT_NAME}-${VERSION}.apk" >> $GITHUB_ENV

      - name: 准备发布产物
        run: |
          mkdir -p stage
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "stage/${APK_NAME}"
          elif ls android/app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk "stage/${APK_NAME}"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk "stage/${APK_NAME}"
          fi

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-${{ env.VERSION }}-apk
          path: stage/${{ env.APK_NAME }}
          retention-days: 7

      - name: 发布到 GitHub Release (仅打 v* 标签时)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "stage/${APK_NAME}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "stage/${APK_NAME}" --generate-notes --title "${PROJECT_NAME} $GITHUB_REF_NAME"
          fi
