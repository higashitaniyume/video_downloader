name: build-apk

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 缓存 Gradle 依赖
        uses: gradle/actions/setup-gradle@v3

      - name: 给 gradlew 赋予执行权限
        run: chmod +x android/gradlew

      - name: 配置签名密钥
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > android/app/key.jks
            cat > android/local.properties << 'EOF'
RELEASE_STORE_FILE=key.jks
EOF
            printf "RELEASE_STORE_PASSWORD=%s\n" "$KEY_STORE_PASSWORD" >> android/local.properties
            printf "RELEASE_KEY_ALIAS=%s\n" "$KEY_ALIAS" >> android/local.properties
            printf "RELEASE_KEY_PASSWORD=%s\n" "$KEY_PASSWORD" >> android/local.properties
            echo "Signing key configured."
          else
            echo "No signing key found. Will build debug APK."
          fi

      - name: 编译 APK
        run: |
          cd android
          if [ -f "app/key.jks" ]; then
            echo "Building signed Release APK..."
            ./gradlew assembleRelease
          else
            echo "Building Debug APK..."
            ./gradlew assembleDebug
          fi

      - name: 准备发布产物
        run: |
          mkdir -p stage
          if [ -f "android/app/build/outputs/apk/release/app-release.apk" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk stage/video-downloader.apk
          elif ls android/app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            cp android/app/build/outputs/apk/release/*.apk stage/video-downloader.apk
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk stage/video-downloader.apk
          fi

      - name: 上传构建产物 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: video-downloader-apk
          path: stage/video-downloader.apk
          retention-days: 7

      - name: 发布到 GitHub Release (仅打 v* 标签时)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" stage/video-downloader.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" stage/video-downloader.apk --generate-notes --title "video-downloader $GITHUB_REF_NAME"
          fi
