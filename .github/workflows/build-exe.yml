name: build-exe

# 自动构建 Windows 可执行文件（PyInstaller onefile，内置 ffmpeg，用户免安装）。
# - push 到 main 分支 / 手动触发：构建并上传 Artifact
# - 推送 v* 标签（如 v0.1.0）：额外自动创建 GitHub Release 并附上 exe

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖与 PyInstaller
        # 直接安装依赖（不 pip install 项目本身），让 PyInstaller 从仓库根目录
        # 收集本地的 app/ 与 parser_core/，避免 editable 安装的路径解析问题。
        # 依赖列表与 pyproject.toml 保持一致。
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter aiohttp cryptography pillow "yt-dlp[default]" pyinstaller

      - name: 下载 ffmpeg（随 exe 分发，用户免安装）
        shell: pwsh
        run: |
          $ffzip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile $ffzip
          Expand-Archive -Path $ffzip -DestinationPath "$env:RUNNER_TEMP\ffmpeg" -Force
          $binDir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Copy-Item (Join-Path $binDir.FullName "bin\ffmpeg.exe") . -Force
          Copy-Item (Join-Path $binDir.FullName "bin\ffprobe.exe") . -Force
          Get-Item ffmpeg.exe, ffprobe.exe | Select-Object Name, Length

      - name: 构建 GUI 可执行文件（PyInstaller onefile）
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name video-downloader-GUI --collect-data customtkinter --collect-all yt_dlp main.py

      - name: 打包产物（exe + ffmpeg）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path stage | Out-Null
          Copy-Item dist\video-downloader-GUI.exe stage\
          Copy-Item ffmpeg.exe stage\
          Copy-Item ffprobe.exe stage\
          $zipName = "video-downloader-GUI-windows-x64-$($env:GITHUB_SHA.Substring(0,7)).zip"
          Compress-Archive -Path stage\* -DestinationPath $zipName -Force
          echo "artifact=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $zipName | Select-Object Name, Length

      - name: 上传构建产物（Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact }}
          path: ${{ env.artifact }}
          if-no-files-found: error
          retention-days: 7

      - name: 发布到 GitHub Release（仅打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" "$env:artifact" --generate-notes --title "video-downloader $env:GITHUB_REF_NAME"
